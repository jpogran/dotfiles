# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Performance optimizations
scan_timeout = 30
command_timeout = 500

# Disable unused modules for performance
[aws]
disabled = true

[gcloud]
disabled = true

[kubernetes]
disabled = true
